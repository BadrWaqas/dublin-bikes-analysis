# Collects a Dublin Bikes snapshot every 30 minutes and commits it to
# data/published/daily/, so the live Streamlit dashboard keeps growing
# without a PC needing to be on. Runs free on GitHub's servers.
#
# Note: GitHub may delay scheduled runs at busy times, and pauses schedules
# in repos with no activity for 60 days (any push re-enables them).
name: Collect Dublin Bikes data

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, off the hour to dodge peak load
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to commit the new data

concurrency:
  group: collect              # never let two runs push at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas   # only what the collector needs

      - name: Take one snapshot and append it
        run: python scripts/ci_append.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/daily
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # Retry once in case another push landed first
          git push || (git pull --rebase && git push)
